
spring.application.name=json-dataset-api

# Import private local database configuration
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/json_dataset_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use Jackson 2 for Spring MVC compatibility
spring.http.converters.preferred-json-mapper=jackson2

# Server Configuration
server.port=8080
